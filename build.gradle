plugins {
    id "dev.architectury.loom" version "1.7-SNAPSHOT" apply false
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "com.github.johnrengelman.shadow" version "8.1.1" apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: "dev.architectury.loom"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    base {
        archivesName = "${rootProject.archives_name}-${project.name}-${rootProject.minecraft_version}"
    }

    repositories {
        maven {
            name = "ParchmentMC"
            url = "https://maven.parchmentmc.org"
        }

        maven {
            name = "tterrag maven"
            url = "https://maven.tterrag.com/"
        }

        maven {
            name = "Jared's maven"
            url = "https://maven.blamejared.com/"
        }

        maven {
            name = "ModMaven"
            url = "https://modmaven.dev"
        }

        maven {
            url = "https://api.modrinth.com/maven"
        }

        maven {
            url = "https://cursemaven.com"
        }

        maven {
            name = "latviandevReleases"
            url = "https://maven.latvian.dev/releases"
        }

        maven {
            url = "https://mvn.devos.one/snapshots"
        }

        maven {
            url = "https://mvn.devos.one/releases"
        }

        maven {
            url = "https://maven.architectury.dev"
            content {
                includeGroup "dev.architectury"
            }
        }

        maven {
            name = "FabricMC"
            url = "https://maven.fabricmc.net/"
        }

        maven {
            name = "NeoForged"
            url = "https://maven.neoforged.net/releases"
        }

        maven {
            name = "Fuzs Mod Resources"
            url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
        }

        maven {
            name = "Mortuusars Github Maven"
            url = "https://raw.githubusercontent.com/mortuusars/resources/main/maven/"
        }

        maven {
            url = "https://maven.createmod.net"
        }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:${rootProject.minecraft_version}"

        mappings loom.layered() {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${parchment_version}@zip")
        }
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 21
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    processResources {
        def expandProps = [
                minecraft_version            : minecraft_version,
                minecraft_version_range      : minecraft_version_range,
                neoforge_version             : neoforge_version,
                neoforge_version_range       : neoforge_version_range,
                neoforge_loader_version_range: neoforge_loader_version_range,
                mod_id                       : mod_id,
                mod_name                     : mod_name,
                mod_version                  : mod_version,
                mod_authors                  : mod_authors,
                mod_description              : mod_description,
                mod_page                     : mod_page,
                mod_issues                   : mod_issues,
                mod_license                  : mod_license,
                maven_group                  : maven_group
        ]

        filesMatching(["fabric.mod.json", "META-INF/neoforge.mods.toml", "*.mixins.json"]) {
            expand expandProps
        }
        inputs.properties(expandProps)
    }
}
