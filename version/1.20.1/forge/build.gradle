plugins {
    id "com.github.johnrengelman.shadow"
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "tterrag maven"
        url = "https://maven.tterrag.com"
    }
    maven {
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven { url = "https://mvn.devos.one/snapshots" }
    maven { url = "https://mvn.devos.one/releases" }
    maven { url = "https://maven.createmod.net" }
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
    forge {
        mixinConfigs = ["exposure_camcorder-neoforge.mixins.json"]
    }
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"
    modImplementation("${rootProject.exposure_group}:exposure-${rootProject.minecraft_version}-forge:${rootProject.exposure_version}") {
        transitive = false
    }
    compileOnly "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    compileOnly "net.fabricmc:sponge-mixin:0.15.2+mixin.0.8.7"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ":common", configuration: "transformProductionForge")
}

shadowJar {
    exclude("architectury.common.json")
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

jar {
    archiveClassifier = "dev"
}

remapJar {
    injectAccessWidener = true
    atAccessWideners.add(loom.accessWidenerPath.get().asFile.name)
    input.set shadowJar.archiveFile
    archiveClassifier = ""
    dependsOn shadowJar
}
