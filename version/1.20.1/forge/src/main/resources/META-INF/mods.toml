modLoader="javafml"
license="${mod_license}"
loaderVersion="${forge_loader_version_range}"
issueTrackerURL="${mod_issues}"
displayURL="${mod_page}"
logoFile="icon.png"

[[mixins]]
config="exposure_camcorder-common.mixins.json"

[[mixins]]
config="exposure_camcorder-neoforge.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description="${mod_description}"

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="exposure"
mandatory=true
versionRange="[1.9,)"
ordering="AFTER"
side="BOTH"
