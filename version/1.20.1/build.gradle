plugins {
    id "dev.architectury.loom" version "1.13.469" apply false
    id "architectury-plugin" version "3.5-SNAPSHOT"
    id "com.github.johnrengelman.shadow" version "8.1.1" apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: "dev.architectury.loom"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    base {
        archivesName = "${rootProject.archives_name}-${project.name}-${rootProject.minecraft_version}"
    }

    repositories {
        maven { url = uri("${rootDir}/local-maven") }
        maven { name = "ParchmentMC"; url = "https://maven.parchmentmc.org" }
        maven { name = "ModMaven"; url = "https://modmaven.dev" }
        maven { url = "https://api.modrinth.com/maven" }
        maven { url = "https://maven.minecraftforge.net/" }
        maven { name = "FabricMC"; url = "https://maven.fabricmc.net/" }
        maven { name = "Mortuusars Github Maven"; url = "https://raw.githubusercontent.com/mortuusars/resources/main/maven/" }
        maven { url = "https://maven.architectury.dev"; content { includeGroup "dev.architectury" } }
        maven { url = "https://mvn.devos.one/releases" }
        maven { url = "https://mvn.devos.one/snapshots" }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:${rootProject.minecraft_version}"
        mappings loom.layered() {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${rootProject.parchment_version}@zip")
        }
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 17
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    processResources {
        def expandProps = [
                minecraft_version            : minecraft_version,
                minecraft_version_range      : minecraft_version_range,
                forge_version                : forge_version,
                forge_version_range          : forge_version_range,
                forge_loader_version_range   : forge_loader_version_range,
                mod_id                       : mod_id,
                mod_name                     : mod_name,
                mod_version                  : mod_version,
                mod_authors                  : mod_authors,
                mod_description              : mod_description,
                mod_page                     : mod_page,
                mod_issues                   : mod_issues,
                mod_license                  : mod_license,
                maven_group                  : maven_group
        ]

        filesMatching(["fabric.mod.json", "META-INF/mods.toml", "*.mixins.json"]) {
            expand expandProps
        }
        inputs.properties(expandProps)
    }
}
