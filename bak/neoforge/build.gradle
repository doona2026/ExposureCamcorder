plugins {
    id "com.github.johnrengelman.shadow"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "tterrag maven"
        url = "https://maven.tterrag.com"
    }
    maven {
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven { url = "https://mvn.devos.one/snapshots" }
    maven { url = "https://mvn.devos.one/releases" }
    maven { url = "https://maven.createmod.net" }
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

dependencies {
    modImplementation "net.neoforged:neoforge:${rootProject.neoforge_version}"
    modImplementation "${rootProject.exposure_group}:exposure-${rootProject.minecraft_version}-neoforge:${rootProject.exposure_version}"
    compileOnly "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    compileOnly "net.fabricmc:sponge-mixin:0.15.2+mixin.0.8.7"
    compileOnly "net.neoforged.fancymodloader:loader:4.0.41"
    compileOnly "net.neoforged:bus:8.0.5"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ":common", configuration: "transformProductionNeoForge")
}

shadowJar {
    exclude("architectury.common.json")
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = ""
}

jar {
    archiveClassifier = "plain"
}

remapJar {
    injectAccessWidener = true
    atAccessWideners.add(loom.accessWidenerPath.get().asFile.name)
    input.set shadowJar.archiveFile
    archiveClassifier = "remapped"
    dependsOn shadowJar
}
